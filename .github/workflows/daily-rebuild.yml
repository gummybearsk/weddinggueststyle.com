name: Daily IndexNow Ping

# No rebuild here any more. Scheduled pages go live on their date without a deploy:
# app/[slug] renders them on first request (ISR), the Vercel cron /api/cron/publish-check
# (05:10 UTC) clears any pinned 404 and refreshes hubs, and /sitemap.xml regenerates on
# its own cron (05:40 UTC). The daily Amazon refresh push already triggers the one build
# a day the price data needs, so the deploy hook that used to sit here built the same
# commit a second time.

on:
  schedule:
    # Run daily at 6:00 AM UTC (1:00 AM EST / 10:00 PM PST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Announce only pages published or revised in the last 2 days (Rule 45: a 2-day window
      # so one missed run never skips a page). Re-pinging all ~77 URLs daily told Bing that
      # unchanged pages had changed.
      - name: Notify IndexNow (Bing + Yandex) — changed pages only
        run: |
          SLUGS=$(node -e "const fs=require('fs');const t=new Date().toISOString().slice(0,10);const f=new Date(Date.now()-2*864e5).toISOString().slice(0,10);for(const n of fs.readdirSync('content/pages')){const p=JSON.parse(fs.readFileSync('content/pages/'+n,'utf8'));const d=p.modifiedDate&&p.modifiedDate<=t?p.modifiedDate:p.publishDate||'';if(d>=f&&d<=t)console.log(p.slug)}")
          if [ -n "$SLUGS" ]; then node scripts/notify-indexnow.js $SLUGS; else echo "No pages published or revised in the last 2 days."; fi
