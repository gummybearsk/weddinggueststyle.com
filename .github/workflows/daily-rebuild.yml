name: Daily IndexNow Ping

# No rebuild here any more. Scheduled pages go live on their date without a deploy:
# app/[slug] renders them on first request (ISR), the Vercel cron /api/cron/publish-check
# (05:10 UTC) clears any pinned 404 and refreshes hubs, and /sitemap.xml regenerates on
# its own cron (05:40 UTC). The daily Amazon refresh push already triggers the one build
# a day the price data needs, so the deploy hook that used to sit here built the same
# commit a second time.

on:
  schedule:
    # Run daily at 6:00 AM UTC (1:00 AM EST / 10:00 PM PST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify IndexNow (Bing + Yandex)
        run: node scripts/notify-indexnow.js
